# PTE-Milenium: MODO ESTABLE (Optimizado con Memoria)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
org.gradle.caching=true

# Configuración de Proxy para Gradle
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=10809
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10809
# systemProp.http.nonProxyHosts=*
# systemProp.https.nonProxyHosts=*

# Fix Android Preferences Conflict
systemProp.android.user.home=/home/alejandro/.android
# systemProp.android.prefs.root=

# Conectividad y Evasión
systemProp.http.keepAlive=true
systemProp.https.keepAlive=true
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.protocols=TLSv1.2,TLSv1.3
org.gradle.dependency.verification=off

# Android X y Kotlin
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
