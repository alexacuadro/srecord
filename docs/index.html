<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-RECORD - Portal Oficial de Instalación Multiplataforma</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #1A237E, #00B0FF);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 10px 15px -3px rgba(0, 176, 255, 0.3);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px;
            color: #38BDF8;
            font-weight: 800;
        }
        p {
            font-size: 13px;
            color: #94A3B8;
            margin: 0 0 28px;
            line-height: 1.5;
        }
        .btn-install {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #10B981, #059669);
            color: #FFFFFF;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 16px 0;
            border-radius: 14px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s;
        }
        .btn-install:active {
            transform: scale(0.98);
        }
        .badge {
            display: inline-block;
            background-color: #0F172A;
            border: 1px solid #334155;
            color: #38BDF8;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎰</div>
        <h1>S-RECORD</h1>
        <div id="deviceBadge" class="badge">DETECTANDO DISPOSITIVO...</div>
        <p id="deviceDesc">Portal oficial de instalación para Android y iPhone.</p>

        <a id="btnInstall" href="#" class="btn-install">
            CARGANDO...
        </a>
    </div>
    <div class="footer">
        S-RECORD Sistema de Gestión Multibanco v1.1.48
    </div>

    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const btn = document.getElementById('btnInstall');
        const badge = document.getElementById('deviceBadge');
        const desc = document.getElementById('deviceDesc');

        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /android/i.test(userAgent);

        const defaultApkUrl = "https://vonuhrbjchufqzqygqgt.supabase.co/storage/v1/object/public/app-updates/app-release-v47-1789239551906.apk";
        const apiKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvbnVocmJqY2h1ZnF6cXlncWd0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDE0NDI5OCwiZXhwIjoyMDk5NzIwMjk4fQ.siz8OYqzfMuOI0dxUuwpQdrk1ywdwSqyKih3wOU4w_Q";

        if (isIOS) {
            badge.innerText = '🍎 DISPOSITIVO iOS (IPHONE)';
            desc.innerText = 'Instalación nativa directa para iPhone vía Safari Over-The-Air (OTA).';
            btn.innerText = '📲 INSTALAR EN MI IPHONE';
            btn.href = 'itms-services://?action=download-manifest&url=https://alexacuadro.github.io/srecord/manifest.plist';
        } else {
            badge.innerText = '🤖 DISPOSITIVO ANDROID';
            desc.innerText = 'Descarga directa del paquete APK oficial para teléfonos Android.';
            btn.innerText = '🤖 DESCARGAR APK PARA ANDROID';
            btn.href = defaultApkUrl;

            // Obtener dinámicamente la última APK publicada en Supabase
            fetch('https://vonuhrbjchufqzqygqgt.supabase.co/rest/v1/app_updates?select=apk_url,version_code&order=version_code.desc&limit=1', {
                headers: { 'apikey': apiKey }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0 && data[0].apk_url) {
                    btn.href = data[0].apk_url;
                }
            })
            .catch(() => {});
        }
    </script>
</body>
</html>
